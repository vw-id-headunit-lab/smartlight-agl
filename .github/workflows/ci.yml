name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check launchers
        run: |
          sh -n trigger_light.sh
          sh -n rollback.sh
          sh -n carplay_light.sh
      - name: Run loopback regression tests and check vendored hashes
        run: python tests/test_trigger.py
      - name: CarPlay source and queue lifecycle tests
        run: python tests/test_carplay.py
      - name: Build runtime archive
        run: python tools/build_release.py
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-report-python-${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: ignore
