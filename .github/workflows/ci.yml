name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format and launchers
        run: |
          test -z "$(gofmt -l cmd internal)"
          sh -n trigger_light.sh
          sh -n carplay_light.sh
          sh -n rollback.sh
      - name: Tests and vet
        run: |
          mkdir -p artifacts
          go test -count=1 -json ./... | tee artifacts/go-tests.json
          go test -race ./...
          go vet ./...
      - name: Static ARM64 package
        run: go run ./cmd/build-release
      - name: Keep reports/package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartlight-agl-go
          path: |
            artifacts/
            dist/
          if-no-files-found: ignore
